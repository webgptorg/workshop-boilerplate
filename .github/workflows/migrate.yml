name: Apply database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/migrate.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency: production-database-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          NODE_ENV: production
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
